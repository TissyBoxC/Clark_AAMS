name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.1.0）；留空则按 pubspec 版本自动生成'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          NAME=$(echo "$VERSION" | cut -d+ -f1)
          CODE=$(echo "$VERSION" | cut -d+ -f2)
          if [ -z "$CODE" ]; then CODE="1"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION"

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag: $TAG"

      # 发布前校验版本一致性：tag 的版本必须等于 pubspec 的 version。
      # 之前 tag 已经打到 v1.5.0，pubspec 却还停在 1.1.0+18，
      # 结果 v1.5.0 的 Release 里装着「1.1.0 (build 18)」的 APK ——
      # 用户装上后应用内显示的版本号是错的，也无法据此判断是否该更新。
      - name: Verify tag matches pubspec version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PUB="${{ steps.version.outputs.name }}"
          TAG_VERSION=$(echo "$TAG" | sed -E 's/^v//' | cut -d+ -f1)
          if [ "$TAG_VERSION" != "$PUB" ]; then
            echo "::error::版本不一致：tag 是 $TAG（版本 $TAG_VERSION），但 pubspec.yaml 是 $PUB"
            echo "发布前请把 pubspec.yaml 的 version 改成与 tag 一致，例如：version=$TAG_VERSION+<递增的构建号>"
            exit 1
          fi
          echo "版本一致：tag=$TAG, pubspec=$PUB"

      - name: Ensure Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已检测到 ANDROID_KEYSTORE_BASE64，使用正式签名。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 ANDROID_KEYSTORE_BASE64，沿用仓库内既有的 debug 签名。"
          fi

      - name: Restore keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      # 阿里云 Maven 镜像会偶发 502（实测 2026-10-25 一次发布中
      # maven.aliyun.com 对 com.android.tools:annotations 返回 502，
      # 导致 62 个依赖同时解析失败，整个构建挂掉）。
      # 这类失败是网络抖动，重试即可，不该让发布卡住或误报成代码问题。
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build APK attempt $attempt"
            if flutter build apk --release \
                --build-name="${{ steps.version.outputs.name }}" \
                --build-number="${{ steps.version.outputs.code }}"; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Build attempt $attempt failed (常见原因：Maven 镜像 502)，准备重试"
            sleep $((attempt * 20))
          done
          echo "::error::APK 构建连续 3 次失败，请检查依赖源是否可用"
          exit 1

      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Clark_AAMS_${{ steps.tag.outputs.tag }}_universal.apk"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f" | sed 's/app-//;s/-release\.apk//')
            cp "$f" "out/Clark_AAMS_${{ steps.tag.outputs.tag }}_${base}.apk"
          done
          ls -lh out
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clark-aams-apk
          path: out/*.apk
          retention-days: 30

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: clark-aams-checksums
          path: out/SHA256SUMS.txt
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Clark AAMS ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Clark AAMS App ${{ steps.tag.outputs.tag }}

            - 版本：${{ steps.version.outputs.name }}（build ${{ steps.version.outputs.code }}）
            - 提交：${{ github.sha }}
            - 构建：GitHub Actions，Flutter 3.47.8 / JDK 21 / AGP 8.11.1

            `universal` 包含全部 ABI，安装包较大；`arm64-v8a` / `armeabi-v7a` / `x86_64`
            为按架构拆分的小体积包。安装任一即可。
          files: out/*.apk
